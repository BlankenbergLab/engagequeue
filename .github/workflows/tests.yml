name: Tests
on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    container: condaforge/miniforge3:24.11.3-0
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.14']
    env:
      CONDA_PKGS_DIRS: ${{ github.workspace }}/.cache/conda/pkgs
      PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip
    steps:
      - uses: actions/checkout@v4
      - name: Create project-local environment
        run: /opt/conda/bin/conda create -y -p .conda/engagequeue -c conda-forge python=${{ matrix.python }} pip
      - name: Install
        run: .conda/engagequeue/bin/python -m pip install -e '.[dev]'
      - name: Lint
        run: .conda/engagequeue/bin/ruff check src tests scripts
      - name: Formatting
        run: .conda/engagequeue/bin/ruff format --check src tests scripts
      - name: Tests
        run: .conda/engagequeue/bin/python -m pytest -q --junitxml=reports/pytest-results.xml
      - name: Build distributions
        run: .conda/engagequeue/bin/python -m build --no-isolation
